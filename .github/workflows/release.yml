name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: read

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/*.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set version
        run: |
          version=`awk -F "=" '$1 == "version" {print $2}' gradle.properties`
          commit_count=`git rev-list HEAD --count`
          version="${version}.r${commit_count}"
          echo "VERSION=$version" >> $GITHUB_ENV

      - name: Build patches + integrations + Manager
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx2g \
            -Pversion=$VERSION \
            -Pgpr.user=min09577 \
            -Pgpr.key=${{ secrets.GH_PAT }} \
            dist :manager:assembleRelease

      - name: Collect release artifacts
        run: |
          mkdir -p build/release
          # patches.jar
          cp patches/build/libs/*.jar build/release/ 2>/dev/null || true
          # integrations.apk
          cp integrations/app/build/outputs/apk/release/*.apk build/release/ 2>/dev/null || true
          # Manager APK (guide app)
          cp manager/build/outputs/apk/release/*.apk build/release/ 2>/dev/null || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: BiliRoamingX-AI ${{ env.VERSION }}
          body: |
            ## BiliRoamingX-AI ${{ env.VERSION }}

            AI 自我维护迭代版本。基于 [BiliRoamingX](https://github.com/BiliRoamingX/BiliRoamingX)。

            ### 命令行注入 (推荐)

            ```shell
            java -jar revanced-cli.jar patch \
              -b patches.jar \
              -m integrations.apk \
              bilibili.apk
            ```

            ### 文件说明
            - `patches.jar` - 补丁包
            - `integrations.apk` - 集成模块  
            - `Manager APK` - 手机上的操作指引（不能直接注入）

            ### 上游变更
            [BiliRoamingX Releases](https://github.com/BiliRoamingX/BiliRoamingX/releases)
          files: |
            build/release/*.jar
            build/release/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
