name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: read

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate debug keystore
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Cache gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/*.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set version
        run: |
          version=`awk -F "=" '$1 == "version" {print $2}' gradle.properties`
          commit_count=`git rev-list HEAD --count`
          version="${version}.r${commit_count}"
          echo "VERSION=$version" >> $GITHUB_ENV

      - name: Build patches + integrations
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: ./gradlew --no-daemon --no-build-cache -Dorg.gradle.jvmargs=-Xmx2g -Pversion=$VERSION -Pgpr.user=min09577 -Pgpr.key=${{ secrets.GH_PAT }} dist

      - name: Build Manager APK
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          rm -rf manager/build/outputs/apk/release
          ./gradlew --no-daemon --no-build-cache -Dorg.gradle.jvmargs=-Xmx2g -Pversion=$VERSION -Pgpr.user=min09577 -Pgpr.key=${{ secrets.GH_PAT }} :manager:assembleRelease

      - name: Sign APK with jarsigner
        run: |
          APK=$(find manager/build/outputs/apk/release -name "*.apk" ! -name "*unsigned*" | head -1)
          echo "Signing APK: $APK"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore debug.keystore -storepass android -keypass android \
            "$APK" androiddebugkey
          echo "Verifying..."
          jarsigner -verify -verbose "$APK" 2>&1 | tail -5

      - name: Copy Manager APK to release dir
        run: |
          mkdir -p build/release
          # 只复制签名的 APK（排除 unsigned）
          for f in manager/build/outputs/apk/release/*.apk; do
            if [[ "$f" != *unsigned* ]]; then
              cp "$f" build/release/
            fi
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: BiliRoamingX-AI ${{ env.VERSION }}
          body: |
            ## BiliRoamingX-AI ${{ env.VERSION }}

            AI 自我维护迭代版本。基于 [BiliRoamingX](https://github.com/BiliRoamingX/BiliRoamingX) 原版持续维护。

            ### 命令行方式
            - `patches.jar` - ReVanced 补丁包
            - `integrations.apk` - 集成模块
            ```shell
            java -jar revanced-cli.jar patch \
              --merge integrations.apk \
              --patch-bundle patches.jar \
              --signing-levels 1,2,3 \
              bilibili.apk
            ```

            ### 📱 一键注入 (推荐)
            - `Manager APK` - 手机安装后自动检测/选 APK → 一键注入 → 安装

            ### 上游变更
            参见 [BiliRoamingX Releases](https://github.com/BiliRoamingX/BiliRoamingX/releases)
          files: |
            build/libs/*.jar
            build/libs/*.apk
            build/release/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
