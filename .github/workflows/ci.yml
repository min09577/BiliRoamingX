name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/*.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx2g \
            -Pgpr.user=min09577 \
            -Pgpr.key=${{ secrets.GH_PAT }} \
            build

      - name: Upload Manager APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: manager-apk
          path: 'manager/build/outputs/apk/release/*.apk'
